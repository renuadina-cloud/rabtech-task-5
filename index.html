<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Product Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <div>
            <h1>Dynamic Product Store</h1>
            <p>Explore products using REST API</p>
        </div>

        <div class="cart-box">
            🛒 Cart: <span id="cartCount">0</span>
        </div>

    </header>


    <main class="container">

        <!-- Search and Sorting -->

        <section class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                aria-label="Search products"
            >

            <select id="sortSelect" aria-label="Sort products">

                <option value="default">
                    Sort Products
                </option>

                <option value="price-low">
                    Price: Low to High
                </option>

                <option value="price-high">
                    Price: High to Low
                </option>

                <option value="name">
                    Name: A-Z
                </option>

            </select>

        </section>


        <!-- Category Buttons -->

        <section class="categories" id="categoryButtons">

            <button class="category-btn active" data-category="all">
                All
            </button>

            <button class="category-btn" data-category="electronics">
                Electronics
            </button>

            <button class="category-btn" data-category="jewelery">
                Jewellery
            </button>

            <button class="category-btn" data-category="men's clothing">
                Men's Clothing
            </button>

            <button class="category-btn" data-category="women's clothing">
                Women's Clothing
            </button>

        </section>


        <!-- Loading Skeleton -->

        <section id="loading" class="loading">

            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>

        </section>


        <!-- Error Message -->

        <div id="errorMessage" class="error-message"></div>


        <!-- Products -->

        <section id="productContainer" class="product-grid"></section>

    </main>


    <script type="module" src="js/app.js"></script>

</body>

</html>
